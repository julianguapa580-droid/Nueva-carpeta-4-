{% extends "base.html" %}
{% block title %}Contraseña{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Cambiar contraseña</h2>
  <p class="muted">Mínimo 10 caracteres, con mayúscula, minúscula, número y símbolo.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Contraseña actual</label>
    <input type="password" name="old_password" required>
    <label>Nueva contraseña</label>
    <input type="password" name="new_password" minlength="10" required>
    <label>Confirmar nueva contraseña</label>
    <input type="password" name="confirm_password" minlength="10" required>
    <button class="btn" type="submit">Actualizar</button>
  </form>
</div>
{% endblock %}
